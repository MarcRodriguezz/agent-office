resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  set $hub http://server:3000;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass $hub;
    proxy_read_timeout 60s;
  }

  location ~ ^/o/(31\d\d)/(api|ws)(/.*)?$ {
    proxy_pass http://server:$1/$2$3$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 81;
  set $first http://server:3101;
  client_max_body_size 2m;

  location ~ ^/o/(31\d\d)/link/(.*)$ {
    proxy_pass http://server:$1/link/$2$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location /link/ {
    proxy_pass $first;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    return 404;
  }
}
